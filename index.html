<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA V — Kompletna Baza Kodów</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --color-canvas-default: #0d1117;
      --color-canvas-subtle: #161b22;
      --color-border-default: #30363d;
      --color-border-muted: #21262d;
      --color-text-primary: #e6edf3;
      --color-text-secondary: #8b949e;
      --color-text-link: #2f81f7;
      --color-accent-emphasis: #238636;
      --color-btn-bg: #21262d;
      --color-btn-hover-bg: #30363d;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas-default);
      color: var(--color-text-primary);
      font-family: var(--font-stack);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 1012px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      body { padding: 24px 16px; }
    }

    /* Pasek narzędzi i filtry */
    .gh-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .gh-toolbar { 
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
    }

    .toolbar-full {
      grid-column: span 3;
      display: flex;
      gap: 8px;
    }

    .gh-input, .gh-select {
      background-color: var(--color-canvas-default);
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      color: var(--color-text-primary);
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--font-stack);
      outline: none;
      width: 100%;
    }

    .gh-input:focus, .gh-select:focus {
      border-color: var(--color-text-link);
      box-shadow: 0 0 0 3px rgba(47,129,247,0.3);
    }

    .gh-select { cursor: pointer; }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-left: auto;
      width: 100%;
    }

    @media (min-width: 640px) {
      .action-buttons { width: auto; }
    }

    .gh-btn {
      background-color: var(--color-btn-bg);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      transition: 0.2s;
    }

    @media (min-width: 640px) {
      .gh-btn { flex: initial; padding: 6px 12px; font-size: 12px; }
    }

    .gh-btn:hover { background-color: var(--color-btn-hover-bg); border-color: #8b949e; }
    .gh-btn-primary { background-color: var(--color-accent-emphasis); color: #ffffff; border-color: rgba(240,246,252,0.1); }
    .gh-btn-primary:hover { background-color: #2ea043; }

    .gh-file-box {
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      background-color: var(--color-canvas-subtle);
      overflow: hidden;
    }

    .gh-file-header {
      background-color: var(--color-border-muted);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border-default);
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    /* Tabela desktopowa */
    .desktop-table-wrapper {
      display: none;
      width: 100%;
      overflow-x: auto;
    }

    @media (min-width: 768px) {
      .desktop-table-wrapper { display: block; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      font-weight: 600;
      background-color: rgba(110, 118, 129, 0.05);
      color: var(--color-text-primary);
      border-bottom: 1px solid var(--color-border-default);
      padding: 10px 16px;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--color-border-muted);
    }

    .category-row td {
      background-color: rgba(56, 139, 253, 0.08) !important;
      font-weight: 600;
      color: #79c0ff;
      border-top: 1px solid var(--color-border-default);
      border-bottom: 1px solid var(--color-border-default);
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    /* Kafelki mobilne */
    .mobile-cards-wrapper {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    @media (min-width: 768px) {
      .mobile-cards-wrapper { display: none; }
    }

    .mobile-category-header {
      font-size: 12px;
      font-weight: 700;
      color: #79c0ff;
      background: rgba(56, 139, 253, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid rgba(56, 139, 253, 0.2);
    }

    .mobile-card {
      background-color: var(--color-canvas-default);
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-card-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--color-text-primary);
      border-bottom: 1px solid var(--color-border-muted);
      padding-bottom: 6px;
    }

    .mobile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
    }

    .mobile-field-label {
      font-size: 10px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }

    .mobile-full-width { grid-column: span 2; }

    code {
      font-family: var(--font-mono);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      background-color: rgba(240, 246, 252, 0.1);
      font-size: 12px;
      display: inline-block;
      width: 100%;
      text-align: center;
    }

    .code-pc { color: #ffa657; }
    .code-phone { color: #7ee787; }
    .pad-combo {
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(110, 118, 129, 0.05);
      padding: 4px;
      border-radius: 4px;
      text-align: center;
    }

    .repo-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
    }

    @media (min-width: 640px) { .repo-footer { text-align: right; } }

    @media print {
      .no-print { display: none !important; }
      body { background-color: #0d1117 !important; padding: 0 !important; }
      .gh-file-box { border: none !important; }
      .desktop-table-wrapper { display: block !important; }
      .mobile-cards-wrapper { display: none !important; }
    }
  </style>
</head>

      <!-- Kafelki mobilne -->

  </div>

    const categoryNames = {
      "gracz": "01. Gracz i Statystyki Podstawowe",
      "swiat": "02. Świat i Otoczenie Gry",
      "bronie": "03. Walka, Bronie i Ekwipunek",
      "pojazdy-lad": "04. Pojazdy Lądowe (Auta i Motory)",
      "pojazdy-lot": "05. Pojazdy Latające",
      "pojazdy-spec": "06. Pojazdy Specjalne i Inne"
    };

    function renderCheats() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase().trim();
      const catVal = document.getElementById("categoryFilter").value;
      const platformVal = document.getElementById("platformFilter").value;

      const desktopTbody = document.getElementById("desktopTableBody");
      const mobileContainer = document.getElementById("mobileCardsContainer");
      
      desktopTbody.innerHTML = "";
      mobileContainer.innerHTML = "";

      let lastCategory = "";
      let visibleCount = 0;

      cheatsData.forEach((cheat) => {
        // Sprawdzanie filtrów kategorii i tekstu
        const matchesCategory = (catVal === "all" || cheat.category === catVal);
        const fullText = `${cheat.title} ${cheat.pc} ${cheat.phone} ${cheat.ps} ${cheat.xbox}`.toLowerCase();
        const matchesSearch = fullText.includes(searchVal);

        // Sprawdzanie filtra platformy
        let matchesPlatform = true;
        if (platformVal === "pc") matchesPlatform = (cheat.pc && cheat.pc !== "Brak");
        if (platformVal === "telefon") matchesPlatform = (cheat.phone && cheat.phone !== "Brak");
        if (platformVal === "ps") matchesPlatform = (cheat.ps && !cheat.ps.includes("Wymaga") && cheat.ps !== "Brak kodu numerycznego");
        if (platformVal === "xbox") matchesPlatform = (cheat.xbox && !cheat.xbox.includes("Wymaga") && cheat.xbox !== "Odblokowanie w menu gry");

        if (matchesCategory && matchesSearch && matchesPlatform) {
          visibleCount++;

          if (cheat.category !== lastCategory) {
            lastCategory = cheat.category;
            const catTitle = categoryNames[cheat.category] || cheat.category;

            const dTr = document.createElement("tr");
            dTr.className = "cheat-row category-row";
            dTr.innerHTML = `<td colspan="5"># ${catTitle}</td>`;
            desktopTbody.appendChild(dTr);

            const mDiv = document.createElement("div");
            mDiv.className = "mobile-category-header";
            mDiv.innerText = `# ${catTitle}`;
            mobileContainer.appendChild(mDiv);
          }

          const dRow = document.createElement("tr");
          dRow.className = "cheat-row";
          dRow.innerHTML = `
            <td><strong>${cheat.title}</strong></td>
            <td><code class="code-pc">${cheat.pc}</code></td>
            <td><code class="code-phone">${cheat.phone}</code></td>
            <td class="pad-combo">${cheat.ps}</td>
            <td class="pad-combo">${cheat.xbox}</td>
          `;
          desktopTbody.appendChild(dRow);

          const mCard = document.createElement("div");
          mCard.className = "mobile-card";
          mCard.innerHTML = `
            <div class="mobile-card-title">${cheat.title}</div>
            <div class="mobile-grid">
              <div>
                <div class="mobile-field-label">PC Konsola (~)</div>
                <code class="code-pc">${cheat.pc}</code>
              </div>
              <div>
                <div class="mobile-field-label">W telefonie</div>
                <code class="code-phone">${cheat.phone}</code>
              </div>
              <div class="mobile-full-width">
                <div class="mobile-field-label">PlayStation</div>
                <div class="pad-combo">${cheat.ps}</div>
              </div>
              <div class="mobile-full-width">
                <div class="mobile-field-label">Xbox</div>
                <div class="pad-combo">${cheat.xbox}</div>
              </div>
            </div>
          `;
          mobileContainer.appendChild(mCard);
        }
      });

      document.getElementById("cheatCount").innerText = `${visibleCount} pasujących kodów`;
    }

    function filterCheats() {
      renderCheats();
    }

    function exportPNG() {
      const element = document.getElementById("exportArea");
      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Renderowanie...";

      html2canvas(element, {
        backgroundColor: '#0d1117',
        scale: 2,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'gta5-kody-platformy.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.innerHTML = originalText;
      }).catch(err => {
        console.error(err);
        alert('Błąd podczas generowania obrazu.');
        btn.innerHTML = originalText;
      });
    }

    window.onload = () => renderCheats();
  </script>
</body>
